name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  analyze:
    name: Analyse (Java)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    env:
      OIE_ENGINE_REPO: openintegrationengine/engine
      OIE_ENGINE_REF: 8c1111ba346cb6fcbc796926e46a55e9590a67a2

    steps:
      - name: Checkout plugin
        uses: actions/checkout@v6
        with:
          path: plugin

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Check out OIE engine
        uses: actions/checkout@v6
        with:
          repository: ${{ env.OIE_ENGINE_REPO }}
          ref: ${{ env.OIE_ENGINE_REF }}
          path: engine

      - name: Cache engine build output
        id: cache-engine
        uses: actions/cache@v5
        with:
          path: |
            engine/server/lib
            engine/server/build
            engine/server/setup
            engine/donkey/lib
            engine/donkey/setup
            engine/client/lib
          key: oie-engine-${{ env.OIE_ENGINE_REF }}-${{ hashFiles('engine/server/mirth-build.xml') }}

      - name: Build OIE engine (compile-only)
        if: steps.cache-engine.outputs.cache-hit != 'true'
        working-directory: engine/server
        run: ant -noinput -f mirth-build.xml -DdisableSigning=true -DdisableTests=true

      - name: Initialise CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: java
          queries: security-and-quality

      - name: Fetch plugin runtime libs
        working-directory: plugin
        run: ant -noinput fetch-libs

      - name: Build plugin for analysis
        working-directory: plugin
        run: ant -noinput compile

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:java"
